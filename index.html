<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>大富翁遊戲</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(11, 80px);
      grid-template-rows: repeat(6, 80px);
      width: fit-content;
      margin: 20px auto;
    }

    .cell {
      width: 80px;
      height: 80px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-size: 12px;
      background: white;
      position: relative;
    }

    .avatars {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }

    .player-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .controls {
      margin-top: 20px;
      display: none;
    }

    button {
      margin: 5px;
      padding: 10px 18px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #setup {
      margin-top: 30px;
    }

    input, select {
      margin: 3px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 160px;
    }

    .grid-editor {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
      border: 1px solid #ddd;
      padding: 10px;
      background: #fff;
    }

    .grid-editor div {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .grid-editor label {
      width: 60px;
    }
  </style>
</head>
<body>
  <h1>🎲 大富翁遊戲</h1>

  <div id="setup">
    <h3>輸入玩家資訊（至少 2 位）</h3>
    <div id="playerInputs">
      <div class="player-input">
        <input type="text" placeholder="玩家 1 名稱" />
        <input type="text" placeholder="頭像網址（可空白）" />
      </div>
      <div class="player-input">
        <input type="text" placeholder="玩家 2 名稱" />
        <input type="text" placeholder="頭像網址（可空白）" />
      </div>
    </div>
    <button onclick="addPlayerInput()">➕ 新增玩家</button>

    <h3>🛠 自訂格子內容</h3>
    <div class="grid-editor" id="gridEditor">
      <!-- 動態填入格子 -->
    </div>

    <button onclick="startGame()">🚀 開始遊戲</button>
  </div>

  <div id="board" class="board"></div>

  <div class="controls">
    <p id="status">目前輪到：</p>
    <button onclick="rollDice()">🎲 擲骰子</button>
  </div>

  <script>
    const boardSize = 44;
    let boardData = Array.from({ length: boardSize }, (_, i) => ({ name: `格子 ${i}`, type: "default" }));
    let players = [];
    let currentPlayer = 0;

    function addPlayerInput() {
      const div = document.createElement("div");
      div.className = "player-input";
      div.innerHTML = `
        <input type="text" placeholder="玩家 ${document.querySelectorAll('.player-input').length + 1} 名稱" />
        <input type="text" placeholder="頭像網址（可空白）" />
      `;
      document.getElementById("playerInputs").appendChild(div);
    }

    function initGridEditor() {
      const editor = document.getElementById("gridEditor");
      for (let i = 0; i < boardSize; i++) {
        const row = document.createElement("div");
        row.innerHTML = `
          <label>格 ${i}：</label>
          <input type="text" id="cell-name-${i}" value="格子 ${i}" />
          <select id="cell-type-${i}">
            <option value="default">普通</option>
            <option value="chance">機會</option>
            <option value="fate">命運</option>
          </select>
        `;
        editor.appendChild(row);
      }
    }

    function applyGridData() {
      for (let i = 0; i < boardSize; i++) {
        const name = document.getElementById(`cell-name-${i}`).value.trim();
        const type = document.getElementById(`cell-type-${i}`).value;
        boardData[i] = { name: name || `格子 ${i}`, type };
      }
    }

    function startGame() {
      players = [];
      document.querySelectorAll('.player-input').forEach(div => {
        const [nameInput, avatarInput] = div.querySelectorAll("input");
        if (nameInput.value.trim()) {
          players.push({
            name: nameInput.value.trim(),
            avatar: avatarInput.value.trim(),
            position: 0
          });
        }
      });

      if (players.length < 2) {
        alert("至少兩位玩家！");
        return;
      }

      applyGridData();
      document.getElementById("setup").style.display = "none";
      document.getElementById("board").style.display = "grid";
      document.querySelector(".controls").style.display = "block";
      renderBoard();
    }

    function renderBoard() {
      const layout = Array(66).fill(null);
      for (let i = 0; i <= 10; i++) layout[i] = i;
      for (let i = 1; i <= 4; i++) layout[i * 11 + 10] = 10 + i;
      for (let i = 10; i >= 0; i--) layout[55 + (10 - i)] = 14 + (11 - i);
      for (let i = 4; i >= 1; i--) layout[i * 11] = 25 + (4 - i);

      const board = document.getElementById("board");
      board.innerHTML = "";

      layout.forEach(index => {
        const cellDiv = document.createElement("div");
        cellDiv.className = "cell";

        if (index != null && boardData[index]) {
          const cell = boardData[index];
          cellDiv.innerHTML = `<strong>${index}</strong><br>${cell.name}`;
          const avatarBox = document.createElement("div");
          avatarBox.className = "avatars";

          players.forEach(p => {
            if (p.position === index) {
              const img = document.createElement("img");
              img.src = p.avatar || "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png";
              img.className = "player-avatar";
              img.title = p.name;
              avatarBox.appendChild(img);
            }
          });

          cellDiv.appendChild(avatarBox);
        }

        board.appendChild(cellDiv);
      });

      document.getElementById("status").innerText = `目前輪到：${players[currentPlayer].name}`;
    }

    function rollDice() {
      const dice = Math.floor(Math.random() * 6) + 1;
      const player = players[currentPlayer];
      alert(`${player.name} 擲出 ${dice} 點！`);
      player.position += dice;
      if (player.position >= boardSize) player.position = boardSize - 1;

      // ❗移除機會與命運格效果，不觸發任何行動
      // cell.type 保留用於顯示樣式或未來擴充

      renderBoard();
      currentPlayer = (currentPlayer + 1) % players.length;
    }

    // 初始化格子設定表單
    initGridEditor();
  </script>
</body>
</html>
